apiVersion: v1
kind: ConfigMap
metadata:
  name: arcana-config
  namespace: arcana-cloud
data:
  database.url: jdbc:mysql://mysql-service:3306/arcana_cloud?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  database.username: arcana
  redis.host: redis-service
  redis.port: "6379"
  deployment.mode: layered
  communication.protocol: grpc
  # Headless Services (see services.yaml): DNS returns every pod so the client's
  # round_robin policy balances per request instead of pinning to one pod.
  service.grpc.url: dns:///arcana-service-grpc:9090
  repository.grpc.url: dns:///arcana-repository-grpc:9091
